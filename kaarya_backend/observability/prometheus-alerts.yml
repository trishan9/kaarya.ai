groups:
  - name: kaarya-api-alerts
    rules:
      - alert: KaaryaApiHigh5xxRate
        expr: |
          (
            sum(rate(kaarya_http_server_errors_total[5m])) /
            clamp_min(sum(rate(kaarya_http_server_requests_total[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High 5xx error rate on Kaarya API
          description: 5xx ratio is above 5% for at least 10 minutes.

      - alert: KaaryaApiHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(kaarya_http_server_request_duration_ms_bucket[5m])) by (le)
          ) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High API latency (p95)
          description: p95 latency is above 1 second for at least 10 minutes.

      - alert: KaaryaApiNoTraffic
        expr: sum(rate(kaarya_http_server_requests_total[10m])) < 0.01
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Kaarya API has almost no traffic
          description: Request rate is near zero for at least 15 minutes.
