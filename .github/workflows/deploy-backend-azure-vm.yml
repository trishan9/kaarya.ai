name: Deploy Kaarya Backend To Azure VM

on:
  push:
    branches: [main]
    paths:
      - "kaarya_backend/**"
      - ".github/workflows/deploy-backend-azure-vm.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-azure-vm
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kaarya-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./kaarya_backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Copy docker-compose to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          port: 22
          source: "kaarya_backend/docker-compose.yml"
          target: ${{ secrets.AZURE_VM_APP_DIR }}
          strip_components: 0

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.AZURE_VM_APP_DIR }}/kaarya_backend"

            if [ ! -f ".env" ]; then
              echo "Missing .env on server at $(pwd)/.env"
              exit 1
            fi

            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.IMAGE }}:latest
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Waiting for API to start..."
            sleep 10
            curl -f http://localhost:3000/api/health || echo "Health check failed - API may still be starting"
            docker compose ps
